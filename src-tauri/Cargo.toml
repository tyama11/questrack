[package]
name = "questrack"
version = "0.1.0"
description = "Questrack - 問題追跡・復習デスクトップアプリ"
authors = ["Questrack Team"]
edition = "2021"

[lib]
name = "tauri_questrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
