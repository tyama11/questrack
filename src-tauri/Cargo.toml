[package]
name = "questrack"
version = "3.0.0"
description = "Questrack - 問題追跡・復習デスクトップアプリ"
authors = ["Questrack Team"]
edition = "2021"

[lib]
name = "tauri_questrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-shell = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# 高速ビルド最適化 (ジョブ時間短縮 & バイナリ軽量化)
[profile.release]
opt-level = "s"
lto = "off"
codegen-units = 16
strip = true
