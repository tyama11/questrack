name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
  workflow_run:
    workflows: ["CI - Test, TypeCheck & Deploy Pages"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Approve and Merge
    runs-on: ubuntu-latest
    steps:
      - name: Handle PR from pull_request_target
        if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Approving Dependabot PR: $PR_URL"
          gh pr review --approve "$PR_URL" || echo "Approve skipped or not needed"
          echo "Attempting to enable auto-merge..."
          gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge flag skipped (requires branch protection)"

      - name: Handle PR on CI Success (workflow_run)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 関連するPR番号を取得
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "CI succeeded for branch: $HEAD_BRANCH"
          if [[ "$HEAD_BRANCH" =~ ^dependabot/ ]]; then
            PR_URL=$(gh pr list --head "$HEAD_BRANCH" --state open --json url --jq '.[0].url' || true)
            if [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
              echo "Merging passed Dependabot PR: $PR_URL"
              gh pr review --approve "$PR_URL" || true
              gh pr merge --squash --delete-branch "$PR_URL" || echo "Could not merge $PR_URL"
            fi
          fi

      - name: Handle manual batch run (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching open Dependabot PRs..."
          prs=$(gh pr list --app dependabot --state open --json number,url --jq '.[].url' || true)
          for pr in $prs; do
            echo "Processing $pr..."
            gh pr review --approve "$pr" || true
            # auto-merge が有効なら設定、または直接マージ試行
            gh pr merge --auto --squash "$pr" || true
          done
