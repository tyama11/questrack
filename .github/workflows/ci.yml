name: CI - Test, TypeCheck & Deploy Pages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-typecheck:
    name: Run Tests & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "rust-main"
          cache-on-failure: true

      - name: Update Cargo dependencies to latest
        run: cargo update --manifest-path src-tauri/Cargo.toml

      - name: Cargo Check (Cache Warmup)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install dependencies and update to latest
        run: |
          npm install
          npm update

      - name: Run Strict Linter (Zero Warnings Allowed)
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Type check & Build
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test-and-typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-desktop-apps:
    name: Build Desktop App (${{ matrix.arch_name }})
    needs: test-and-typecheck
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            targets: 'x86_64-apple-darwin'
            tauri_args: '--target x86_64-apple-darwin'
            arch_name: 'macOS-Intel-x86_64'
          - platform: 'macos-latest'
            targets: 'aarch64-apple-darwin'
            tauri_args: '--target aarch64-apple-darwin'
            arch_name: 'macOS-AppleSilicon-arm64'
          - platform: 'windows-latest'
            targets: 'x86_64-pc-windows-msvc'
            tauri_args: '--target x86_64-pc-windows-msvc'
            arch_name: 'Windows-x64'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust Cache (ビルド高速化)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "rust-${{ matrix.arch_name }}"
          shared-key: "questrack-${{ matrix.arch_name }}"
          cache-on-failure: true

      - name: Update Cargo dependencies to latest
        run: cargo update --manifest-path src-tauri/Cargo.toml

      - name: Install and update frontend dependencies
        run: |
          npm install
          npm update

      - name: Build Tauri Desktop Application & Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Questrack Desktop App (Latest)' }}
          releaseBody: |
            ## Questrack Desktop Release
            - Cross-platform release built automatically via GitHub Actions CI/CD.
            - macOS Intel: Questrack_x64.dmg (for Intel Mac)
            - macOS Apple Silicon: Questrack_aarch64.dmg (for M1/M2/M3/M4)
            - Windows: Questrack_x64-setup.exe (.exe / .msi)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: questrack-${{ matrix.arch_name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
