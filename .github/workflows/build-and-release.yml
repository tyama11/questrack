name: Release & Build App

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name / Version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
        type: string
      draft:
        description: 'Create draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            targets: 'x86_64-apple-darwin'
            tauri_args: '--target x86_64-apple-darwin'
            arch_name: 'macOS-Intel-x86_64'
          - platform: 'macos-latest'
            targets: 'aarch64-apple-darwin'
            tauri_args: '--target aarch64-apple-darwin'
            arch_name: 'macOS-AppleSilicon-arm64'
          - platform: 'windows-latest'
            targets: 'x86_64-pc-windows-msvc'
            tauri_args: '--target x86_64-pc-windows-msvc'
            arch_name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.arch_name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust Cache (ビルド高速化)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "rust-${{ matrix.arch_name }}"
          shared-key: "questrack-${{ matrix.arch_name }}"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Application & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || (github.event.inputs.release_name && github.event.inputs.release_name != '' && github.event.inputs.release_name || '') }}
          releaseName: ${{ github.event.inputs.release_name || (github.ref_type == 'tag' && github.ref_name) || 'Questrack Release' }}
          releaseBody: |
            ## Questrack Desktop Release
            - Cross-platform release built automatically via GitHub Actions CI/CD.
            - macOS Intel: Questrack_x64.dmg (for Intel Mac)
            - macOS Apple Silicon: Questrack_aarch64.dmg (for M1/M2/M3/M4)
            - Windows: Questrack_x64-setup.exe (.exe / .msi)
          releaseDraft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          args: ${{ matrix.tauri_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: questrack-${{ matrix.arch_name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
